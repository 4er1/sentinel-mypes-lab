apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tienda-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __BRANCH__
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: mypes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true      # <- la AUTO-RECUPERACIÓN: revierte cambios manuales
    syncOptions:
      - CreateNamespace=true
