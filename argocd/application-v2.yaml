apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mype-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __BRANCH__
    path: gitops/app-v2
  destination:
    server: https://kubernetes.default.svc
    namespace: mypes-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
